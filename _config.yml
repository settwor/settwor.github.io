# =============================================================
# SETTWOR — Jekyll settings (GitHub Pages builds this by itself)
# =============================================================

title: SETTWOR
description: Official site of SETTWOR, an active phonk and Brazilian funk producer from Ukraine based in Poland.
url: "https://settwor.com.pl"
baseurl: ""
lang: en

# Dates without a time zone are read as Warsaw time.
timezone: Europe/Warsaw

# Publish a post even if its date is a few hours "in the future"
# (GitHub builds in UTC, so a post written at 00:30 Warsaw time
# would otherwise stay hidden until the next build).
future: true

# Address of every new article: /news/2026/10/title-of-the-article/
# Old articles keep their old address with "permalink" in their file.
permalink: /news/:year/:month/:title/

markdown: kramdown

# Every file in _posts uses the article template automatically,
# so new articles made in Pages CMS need no extra settings.
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: article
  - scope:
      path: "_bio"
    values:
      layout: bio
      # left column of a biography: the list of its sections
      rail: bio
      license_note: true
      order: 99

  # Old addresses that must never change (they are known to Google).
  # They are kept here, not inside the files, so that the editor in
  # Pages CMS cannot remove them by accident.
  - scope:
      path: "_posts/2025-12-12-first-track-in-the-brazilian-funk-genre.md"
    values:
      permalink: "/news/First-Track-in-the-Brazilian-Funk-Genre_(12-12-2025).html"
  - scope:
      path: "_bio/en.md"
    values:
      permalink: /bio.html
  - scope:
      path: "_bio/ru.md"
    values:
      permalink: /bioRU.html
  - scope:
      path: "_bio/pl.md"
    values:
      permalink: /bioPL.html

# Biographies (one file per language) and releases (one file per release).
# New biography languages get the address /bio/<file name>/ automatically.
collections:
  bio:
    output: true
    permalink: /bio/:name/
  releases:
    output: false

# Files that must NOT be published on the website.
exclude:
  - README.md
  - docs
  - tools
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - VERSION
  - CHANGELOG.md
  - AI-NOTES.md

# Browser push notifications (bell in the corner). Paste the App ID from onesignal.com here
# (see docs/news-guide-ru.md). While it is empty, nothing is loaded and no bell is shown.
onesignal_app_id: "6f326eec-8562-4a6d-bf90-05d10f42a93a"

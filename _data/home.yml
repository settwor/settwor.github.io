about_title: About SETTWOR
# Markdown: a blank line starts a new paragraph, [text](https://address) makes a link.
about: |
  SETTWOR is a music producer specializing in [phonk](https://en.wikipedia.org/wiki/Phonk), [Brazilian funk](https://en.wikipedia.org/wiki/Funk_carioca), and dance/electronic music. Originally from [Kryvyi Rih](https://en.wikipedia.org/wiki/Kryvyi_Rih), Ukraine, he relocated to Poland in 2022.

  He is best known for his music, his YouTube channel, and short TikTok videos featuring his tracks. He is also the owner of one of the popular 8D music channels.
callout: SETTWOR is one of the most popular phonk artists on Pandora.


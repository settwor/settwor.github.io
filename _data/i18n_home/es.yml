about_title: "Sobre SETTWOR"
# Markdown: a blank line starts a new paragraph, [text](https://address) makes a link.
about: |
  SETTWOR es un artista y productor de [phonk](https://en.wikipedia.org/wiki/Phonk) que también trabaja con [funk brasileño](https://en.wikipedia.org/wiki/Funk_carioca) y música dance/electrónica. Originario de [Kryvyi Rih](https://en.wikipedia.org/wiki/Kryvyi_Rih), Ucrania, se mudó a Polonia en 2022.

  Es más conocido por su música, su canal de YouTube y los videos cortos de TikTok con sus temas. También es el dueño de uno de los canales populares de música 8D.
callout: "SETTWOR es uno de los artistas de phonk más populares en Pandora."


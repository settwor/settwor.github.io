faq_title: "Preguntas sobre SETTWOR"
faq:
  - q: "¿Quién es SETTWOR?"
    a: "SETTWOR es un artista y productor de phonk de Kryvyi Rih, Ucrania, radicado en Polonia. Hace phonk, funk brasileño y música dance/electrónica, y publica música desde 2021."
  - q: "¿En qué géneros trabaja SETTWOR?"
    a: "Principalmente phonk y funk brasileño, y también EDM."
  - q: "¿Cuál es el tema más popular de SETTWOR?"
    a: "GOT ME UP 2, del álbum GET IT, Vol.1. Superó 1,000,000 de reproducciones en todas las plataformas el 22 de febrero de 2026 y es el lanzamiento más exitoso de su carrera."
  - q: "¿Cuándo publicó SETTWOR su primer tema?"
    a: "En 2021, con «Light Wave». Adoptó el nombre SETTWOR y abrió su canal de YouTube en 2020."
  - q: "¿Con quién ha colaborado SETTWOR?"
    a: "Con Mc Baiano en el relanzamiento de «SE TU QUER» (4 de septiembre de 2026) y con MC GW en «Toma Jatada» (10 de octubre de 2026). Ambos lanzamientos contaron con el apoyo de Authentic Records."
  - q: "¿Dónde puedo escuchar a SETTWOR?"
    a: "En Spotify, Apple Music, YouTube y otras plataformas. Los enlaces de cada lanzamiento están en la página de Lanzamientos de este sitio."
  - q: "¿Cuáles son las redes sociales oficiales de SETTWOR?"
    a: "Spotify, YouTube (youtube.com/c/settwor), Instagram (instagram.com/settwor) y Telegram (settw0r.t.me). Todas están enlazadas en este sitio."
  - q: "¿Cómo puedo contactar a SETTWOR?"
    a: "Por correo electrónico: settwor@gmail.com."


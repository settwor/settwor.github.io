faq_title: "Питання про SETTWOR"
faq:
  - q: "Хто такий SETTWOR?"
    a: "SETTWOR — phonk-артист і продюсер із Кривого Рогу, Україна, який живе в Польщі. Він робить phonk, бразильський фанк та танцювальну/електронну музику і випускає музику з 2021 року."
  - q: "У яких жанрах працює SETTWOR?"
    a: "Переважно в phonk і бразильському фанку, а також в EDM."
  - q: "Який найпопулярніший трек SETTWOR?"
    a: "GOT ME UP 2, з альбому GET IT, Vol.1. 22 лютого 2026 року він подолав позначку 1,000,000 прослуховувань на всіх платформах і став найуспішнішим релізом у його кар’єрі."
  - q: "Коли SETTWOR випустив перший трек?"
    a: "У 2021 році, це «Light Wave». Ім’я SETTWOR він узяв і відкрив свій канал на YouTube у 2020 році."
  - q: "З ким співпрацював SETTWOR?"
    a: "З Mc Baiano над перевиданням «SE TU QUER» (4 вересня 2026) та з MC GW над треком «Toma Jatada» (10 жовтня 2026). Обидва релізи підтримав Authentic Records."
  - q: "Де можна слухати SETTWOR?"
    a: "На Spotify, Apple Music, YouTube та інших платформах. Посилання для кожного релізу є на сторінці «Релізи» цього сайту."
  - q: "Які офіційні соцмережі має SETTWOR?"
    a: "Spotify, YouTube (youtube.com/c/settwor), Instagram (instagram.com/settwor) і Telegram (settw0r.t.me). Усі вони вказані на цьому сайті."
  - q: "Як зв’язатися з SETTWOR?"
    a: "Електронною поштою: settwor@gmail.com."


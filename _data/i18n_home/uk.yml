about_title: "Про SETTWOR"
# Markdown: a blank line starts a new paragraph, [text](https://address) makes a link.
about: |
  SETTWOR — [phonk](https://en.wikipedia.org/wiki/Phonk)-артист і продюсер, який також працює в жанрах [бразильського фанку](https://en.wikipedia.org/wiki/Funk_carioca) та танцювальної/електронної музики. Родом із [Кривого Рогу](https://en.wikipedia.org/wiki/Kryvyi_Rih), Україна, у 2022 році переїхав до Польщі.

  Найбільше відомий своєю музикою, каналом на YouTube та короткими відео в TikTok з його треками. Він також власник одного з популярних 8D-музичних каналів.
callout: "SETTWOR — один із найпопулярніших phonk-артистів на Pandora."


about_title: "Sobre o SETTWOR"
# Markdown: a blank line starts a new paragraph, [text](https://address) makes a link.
about: |
  SETTWOR é um artista e produtor de [phonk](https://en.wikipedia.org/wiki/Phonk) que também trabalha com [funk brasileiro](https://en.wikipedia.org/wiki/Funk_carioca) e música dance/eletrônica. Natural de [Kryvyi Rih](https://en.wikipedia.org/wiki/Kryvyi_Rih), Ucrânia, mudou-se para a Polônia em 2022.

  É mais conhecido por sua música, seu canal no YouTube e pelos vídeos curtos no TikTok com suas faixas. Também é dono de um dos canais populares de música 8D.
callout: "SETTWOR é um dos artistas de phonk mais populares na Pandora."


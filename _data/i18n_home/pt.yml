faq_title: "Perguntas sobre o SETTWOR"
faq:
  - q: "Quem é o SETTWOR?"
    a: "SETTWOR é um artista e produtor de phonk de Kryvyi Rih, Ucrânia, radicado na Polônia. Ele faz phonk, funk brasileiro e música dance/eletrônica e lança músicas desde 2021."
  - q: "Em quais gêneros o SETTWOR trabalha?"
    a: "Principalmente phonk e funk brasileiro, e também EDM."
  - q: "Qual é a faixa mais popular do SETTWOR?"
    a: "GOT ME UP 2, do álbum GET IT, Vol.1. Ela passou de 1,000,000 de reproduções em todas as plataformas em 22 de fevereiro de 2026 e é o lançamento de maior sucesso da carreira dele."
  - q: "Quando o SETTWOR lançou a primeira faixa?"
    a: "Em 2021, com «Light Wave». Ele adotou o nome SETTWOR e abriu seu canal no YouTube em 2020."
  - q: "Com quem o SETTWOR já colaborou?"
    a: "Com Mc Baiano no relançamento de «SE TU QUER» (4 de setembro de 2026) e com MC GW em «Toma Jatada» (10 de outubro de 2026). Os dois lançamentos tiveram o apoio da Authentic Records."
  - q: "Onde posso ouvir o SETTWOR?"
    a: "No Spotify, Apple Music, YouTube e outras plataformas. Os links de cada lançamento estão na página de Lançamentos deste site."
  - q: "Quais são as redes sociais oficiais do SETTWOR?"
    a: "Spotify, YouTube (youtube.com/c/settwor), Instagram (instagram.com/settwor) e Telegram (settw0r.t.me). Todas estão linkadas neste site."
  - q: "Como posso entrar em contato com o SETTWOR?"
    a: "Por e-mail: settwor@gmail.com."


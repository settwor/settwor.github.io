about_title: "O SETTWOR"
# Markdown: a blank line starts a new paragraph, [text](https://address) makes a link.
about: |
  SETTWOR to artysta i producent [phonk](https://en.wikipedia.org/wiki/Phonk), który tworzy też [brazylijski funk](https://en.wikipedia.org/wiki/Funk_carioca) oraz muzykę taneczną i elektroniczną. Pochodzi z [Krzywego Rogu](https://en.wikipedia.org/wiki/Kryvyi_Rih) na Ukrainie, w 2022 roku przeprowadził się do Polski.

  Jest najbardziej znany ze swojej muzyki, kanału na YouTube oraz krótkich filmów na TikToku z jego utworami. Jest też właścicielem jednego z popularnych kanałów z muzyką 8D.
callout: "SETTWOR to jeden z najpopularniejszych artystów phonk na Pandorze."


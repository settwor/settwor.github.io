faq_title: "Pytania o SETTWOR"
faq:
  - q: "Kim jest SETTWOR?"
    a: "SETTWOR to artysta i producent phonk z Krzywego Rogu na Ukrainie, mieszkający w Polsce. Tworzy phonk, brazylijski funk oraz muzykę taneczną i elektroniczną, a muzykę wydaje od 2021 roku."
  - q: "W jakich gatunkach tworzy SETTWOR?"
    a: "Głównie w phonku i brazylijskim funku, a także w EDM."
  - q: "Jaki jest najpopularniejszy utwór SETTWOR?"
    a: "GOT ME UP 2, z albumu GET IT, Vol.1. 22 lutego 2026 roku przekroczył 1,000,000 odtworzeń na wszystkich platformach i jest najbardziej udanym wydawnictwem w jego karierze."
  - q: "Kiedy SETTWOR wydał pierwszy utwór?"
    a: "W 2021 roku, utworem „Light Wave”. Pseudonim SETTWOR przyjął i założył kanał na YouTube w 2020 roku."
  - q: "Z kim współpracował SETTWOR?"
    a: "Z Mc Baiano przy reedycji „SE TU QUER” (4 września 2026) oraz z MC GW przy utworze „Toma Jatada” (10 października 2026). Oba wydawnictwa wsparło Authentic Records."
  - q: "Gdzie można słuchać SETTWOR?"
    a: "Na Spotify, Apple Music, YouTube i innych platformach. Linki do każdego wydawnictwa są na stronie „Wydania” tej witryny."
  - q: "Jakie są oficjalne media społecznościowe SETTWOR?"
    a: "Spotify, YouTube (youtube.com/c/settwor), Instagram (instagram.com/settwor) i Telegram (settw0r.t.me). Wszystkie są podlinkowane na tej stronie."
  - q: "Jak skontaktować się z SETTWOR?"
    a: "Pisząc na adres e-mail settwor@gmail.com."


<!-- ===== Cookie consent (analytics is loaded only after "Accept") ===== -->
<div class="consent" id="consent" role="region" aria-label="Cookie consent" hidden>
    <p class="consent__text">This site uses Google Analytics cookies to see which pages are read. They are set only if you accept. You can change this any time with “Cookie settings” in the footer. <a href="/privacy.html">Privacy policy</a></p>
    <div class="consent__actions">
        <button class="btn btn--sm" type="button" data-consent="denied">Decline</button>
        <button class="btn btn--sm" type="button" data-consent="granted">Accept</button>
    </div>
</div>

<noscript>
    <p class="noscript">JavaScript is disabled: the menu button and cookie settings are unavailable, and analytics stays off.</p>
</noscript>

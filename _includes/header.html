<!-- ===== Header (one copy for the whole site) ===== -->
<header class="site-header">
    <div class="site-header__start">
        <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
            <span class="burger__line"></span>
            <span class="burger__line"></span>
            <span class="burger__line"></span>
        </button>
        <nav class="site-nav site-nav--start" aria-label="Releases and news">
            <ul>
                <li><a class="btn btn--sm" href="/releases.html">All Releases</a></li>
                <li><a class="btn btn--sm" href="/news.html">News</a></li>
            </ul>
        </nav>
    </div>

    <a class="brand" href="/" aria-label="SETTWOR — home">
        <img src="/images/SETTWOR%20vector.svg" alt="SETTWOR" height="24">
    </a>

    <nav class="site-nav site-nav--end" aria-label="About the artist">
        <ul>
            <li><a class="btn btn--sm" href="/bio.html">Biography</a></li>
            <li class="is-desktop"><a class="btn btn--sm" href="/photo.html">Photos</a></li>
        </ul>
    </nav>
</header>

<nav class="mobile-menu" id="mobile-menu" aria-label="Mobile menu">
    <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Main</a>
    <a href="/bio.html"{% if page.url == "/bio.html" %} aria-current="page"{% endif %}>Biography</a>
    <a href="/photo.html"{% if page.url == "/photo.html" %} aria-current="page"{% endif %}>Photographs</a>
    <a href="/news.html"{% if page.url == "/news.html" or page.layout == "article" %} aria-current="page"{% endif %}>News</a>
    <a href="/releases.html"{% if page.url == "/releases.html" %} aria-current="page"{% endif %}>Releases</a>
</nav>

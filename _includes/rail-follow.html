{%- comment -%} Right column, top: the official channels and the email. Data: _data/links.yml {%- endcomment -%}
<section class="rail-block" aria-labelledby="rail-follow">
    <h2 class="rail-block__title" id="rail-follow">Follow SETTWOR</h2>
    <ul class="rail-list">
        {%- for item in site.data.links.follow %}
        <li><a class="rail-link" href="{{ item.url }}" rel="me"><span class="rail-link__name">{{ item.name }}</span></a></li>
        {%- endfor %}
    </ul>
</section>

<section class="rail-block" aria-labelledby="rail-contact">
    <h2 class="rail-block__title" id="rail-contact">Contact</h2>
    <p class="rail-text"><a href="mailto:{{ site.data.links.email }}">{{ site.data.links.email }}</a></p>
</section>

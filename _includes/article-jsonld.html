{%- comment -%}
  Structured data for one article (NewsArticle + breadcrumbs).
  Everything comes from the fields of the article, nothing is typed by hand.
{%- endcomment -%}
{%- assign aj_site = site.url | append: "/" -%}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "mainEntityOfPage": { "@type": "WebPage", "@id": {{ canonical | jsonify }} },
    "headline": {{ page.title | jsonify }},
{%- if page.description and page.description != "" %}
    "description": {{ page.description | jsonify }},
{%- endif %}
{%- if cover and cover != "" %}
    "image": [ {{ cover | absolute_url | jsonify }} ],
{%- endif %}
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
{%- if page.updated and page.updated != "" %}
    "dateModified": {{ page.updated | date_to_xmlschema | jsonify }},
{%- endif %}
    "inLanguage": {{ page.lang | default: "en" | jsonify }},
    "author": { "@type": "MusicGroup", "@id": "{{ aj_site }}#artist", "name": {{ author_name | jsonify }}, "url": {{ aj_site | jsonify }} },
    "publisher": { "@type": "MusicGroup", "@id": "{{ aj_site }}#artist", "name": "SETTWOR", "url": {{ aj_site | jsonify }} },
    "isPartOf": { "@type": "WebSite", "@id": "{{ aj_site }}#website", "name": "SETTWOR", "url": {{ aj_site | jsonify }} }
}
</script>
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "SETTWOR", "item": {% if i18n_lang == "en" %}{{ aj_site | jsonify }}{% else %}{{ i18n_u_home | absolute_url | jsonify }}{% endif %} },
        { "@type": "ListItem", "position": 2, "name": {{ art_t_news | jsonify }}, "item": {{ i18n_u_news | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
    ]
}
</script>

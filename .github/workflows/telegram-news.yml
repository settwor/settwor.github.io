# Tells the Telegram channel about every NEW article.
# It runs after each change in the folder _posts and does nothing unless a new file was added.
# Setup (once): see docs/news-guide-ru.md, section "Уведомления о новых статьях".
name: Telegram news

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new articles
        id: new
        run: |
          # files ADDED by this change (editing an old article sends nothing)
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE=HEAD~1; fi
          FILES=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- '_posts/*.md' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "New articles: ${FILES:-none}"

      - uses: actions/setup-python@v5
        if: steps.new.outputs.files != ''
        with:
          python-version: "3.12"

      - name: Send to Telegram
        if: steps.new.outputs.files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install pyyaml
          python3 tools/notify-telegram.py ${{ steps.new.outputs.files }}

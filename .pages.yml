# =============================================================
# Pages CMS settings for settwor.github.io
# Open https://app.pagescms.org, sign in with GitHub and choose
# this repository. Everything editable on the site is listed here.
# Sections of the menu: News, Biography, Photos, Releases and
# the group "Site" (home page, links, page texts).
# =============================================================

# Where uploaded pictures are saved (the folder "images" of the site).
media:
  input: images
  output: /images

content:

  # ---------------------------------------------------------
  # NEWS: one file in the folder _posts per article
  # ---------------------------------------------------------
  - name: news
    label: News
    type: collection
    path: _posts
    format: yaml-frontmatter
    # The name of the file (and so the web address) is made from the title.
    # It is asked only when a new article is created.
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The headline of the article. It is also the first line Google shows."

      - name: description
        label: Short summary
        type: text
        required: true
        description: "One or two sentences (up to 160 characters). Shown under the title, in the news list, in Google and in link previews."

      - name: date
        label: Date and time
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
        description: "When the article was published. Do not change it later."

      - name: image
        label: Cover picture
        type: image
        options:
          path: images/news
          rename: true
          extensions: [jpg, jpeg, png, webp]
        description: "Use a picture at least 1200 pixels wide. It is used on the page, in Google and in link previews."

      - name: image_alt
        label: Describe the picture
        type: string
        description: "For people who cannot see it and for search engines. Say what is shown, for example: SETTWOR in the studio, October 2026."

      - name: image_caption
        label: Picture caption
        type: string
        description: "Optional. A short line under the picture, for example the name of the photographer."

      - name: body
        label: Text of the article
        type: rich-text

      - name: listen_url
        label: Link to the release
        type: string
        description: "Optional. A link to Spotify or another platform. Adds an Open on Spotify button under the article."

      - name: sources
        label: Sources (numbered list at the bottom)
        type: object
        list: true
        description: "Optional. Item 1 is the first row, item 2 the second. In the text, a small mark [1] is a link to #ref-1, [2] a link to #ref-2 ..., so it jumps to this list."
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: Address
            type: string
          - name: site
            label: Site (shown in grey after the title)
            type: string

      - name: updated
        label: Date of the last correction
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
        description: "Leave empty unless you want it. Nothing is added automatically: only when you fill this in, the page shows Updated and Google sees the date."

      - name: published
        label: Show on the website
        type: boolean
        default: true
        description: "Switch off to hide the article without deleting it. Keep it ON for a normal article."

  # ---------------------------------------------------------
  # BIOGRAPHY: one file in the folder _bio per language.
  # A new language = a new entry. It gets its own web address,
  # its own page in Google and a button in the language list.
  # ---------------------------------------------------------
  - name: bio
    label: Biography
    type: collection
    path: _bio
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [lang_name, lang]
      primary: lang_name
      sort: [order]
    fields:
      - name: lang_name
        label: Language name (shown on the button)
        type: string
        required: true
        description: "In that language, for example: Deutsch, Español, Українська."

      - name: lang
        label: Language code
        type: string
        required: true
        description: "Two letters, lower case: de, es, uk, fr. Google uses it to show the page to people who speak that language."

      - name: order
        label: Place in the language list
        type: number
        description: "1, 2, 3 ... English is 1."

      - name: title
        label: Page title
        type: string
        required: true
        description: "The big heading of the page, for example: SETTWOR Biografie."

      - name: seo_title
        label: Title in Google
        type: string
        description: "Optional. What Google shows as the headline, for example: SETTWOR Offizielle Biografie."

      - name: description
        label: Short summary for Google
        type: text
        required: true
        description: "One or two sentences in that language (up to 160 characters)."

      - name: lead
        label: Line under the heading
        type: string

      - name: photo
        label: Photo
        type: image
        options:
          path: images
          rename: true
          extensions: [jpg, jpeg, png, webp]
        description: "Leave as it is to use the main photo of the site."

      - name: photo_alt
        label: Describe the photo
        type: string

      - name: photo_caption
        label: Photo caption
        type: string

      - name: body
        label: Text of the biography
        type: rich-text
        description: "Use the heading buttons: Heading 2 for big parts (they appear in the contents list), Heading 3 for smaller parts."

      - name: faq_title
        label: Title of the questions block
        type: string
        description: "For example: Questions and answers."

      - name: faq
        label: Questions and answers
        type: object
        list: true
        description: "Short facts as questions. Google can show them in the search results."
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text

      - name: snapshot
        label: Key facts (the box at the top)
        type: object
        list: true
        description: "Short facts shown right under the photo: born, from, genres ... Six rows look best."
        fields:
          - name: label
            label: Name of the fact
            type: string
          - name: value
            label: Value
            type: string

      - name: highlights
        label: Key moments (timeline at the top)
        type: object
        list: true
        description: "The main dates of the career, oldest first. One short sentence each."
        fields:
          - name: year
            label: Year
            type: string
          - name: text
            label: What happened
            type: text

      - name: refs_title
        label: Title of the list of sources
        type: string
        description: "For example: References (Referencias, Przypisy ...). Shown at the bottom, like on Wikipedia."

      - name: sources
        label: Sources (numbered list at the bottom)
        type: object
        list: true
        description: "Item 1 is the first row, item 2 the second and so on. In the text, a small mark [1] is a link to #ref-1, [2] a link to #ref-2 ..., so it jumps to this list."
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: Address
            type: string
          - name: site
            label: Site (shown in grey after the title)
            type: string

      - name: external_title
        label: Title of the list of external links
        type: string
        description: "For example: External links."

      - name: external
        label: External links (list at the bottom)
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: Address
            type: string
          - name: desc
            label: Short note (optional)
            type: string

  # ---------------------------------------------------------
  # PHOTOS: the list in _data/gallery.yml. The year tabs on the
  # Photos page are made from the dates.
  # ---------------------------------------------------------
  - name: photos
    label: Photos
    type: file
    path: _data/gallery.yml
    format: yaml
    fields:
      - name: photos
        label: Photographs
        type: object
        list: true
        description: "Add a photo with the Add button. The order does not matter: the page sorts them by date."
        fields:
          - name: image
            label: Picture
            type: image
            options:
              path: images/photos
              rename: true
              extensions: [jpg, jpeg, png, webp]
            description: "Best size: 2000 pixels on the long side."
          - name: date
            label: Date of the photo
            type: date
            options:
              format: "yyyy-MM-dd"
            description: "The year of this date decides on which year tab the photo appears."
          - name: alt
            label: Describe the photo
            type: string
            description: "For example: SETTWOR in Warsaw, August 2025."

  # ---------------------------------------------------------
  # RELEASES: one file in the folder _releases per release
  # ---------------------------------------------------------
  - name: releases
    label: Releases
    type: collection
    path: _releases
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, artist, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Name of the release
        type: string
        required: true

      - name: artist
        label: Artists
        type: string
        required: true
        description: "For example: SETTWOR or SETTWOR, Mc Baiano."

      - name: date
        label: Release date
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"

      - name: kind
        label: Kind
        type: string
        description: "Single, Album, EP or Mixtape. Empty means Single."

      - name: cover
        label: Cover
        type: image
        options:
          path: images/releases
          rename: true
          extensions: [jpg, jpeg, png, webp]
        description: "A square picture, at least 600 pixels."

      - name: spotify
        label: Spotify link
        type: string
        description: "Optional. The cover then opens this address."

      - name: details
        label: Tracklist page (optional)
        type: string
        description: "Address of a page with the list of tracks, if there is one."

      - name: links
        label: Other platforms
        type: object
        description: "Direct links to this release. Leave a field empty if there is no link: the preview window then offers a search on that platform."
        fields:
          - { name: apple, label: Apple Music, type: string }
          - { name: youtube_music, label: YouTube Music, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: deezer, label: Deezer, type: string }
          - { name: soundcloud, label: SoundCloud, type: string }
          - { name: tidal, label: TIDAL, type: string }
          - { name: amazon, label: Amazon Music, type: string }
          - { name: yandex, label: Yandex Music, type: string }
          - { name: vk, label: VK Music, type: string }
          - { name: bandcamp, label: Bandcamp, type: string }

      - name: tracklist
        label: Tracklist
        type: string
        list: true
        description: "One track per line, in order. A single without a list shows its own name."

  # ---------------------------------------------------------
  # SITE: home page, links, texts of the list pages
  # ---------------------------------------------------------
  - name: site
    label: Site
    type: group
    items:

      - name: home
        label: Home page
        type: file
        path: _data/home.yml
        format: yaml
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - name: photo
                label: Main photo
                type: image
                options:
                  path: images
                  rename: true
                  extensions: [jpg, jpeg, png, webp]
                description: "Shown round at the top of the home page and used in Google and in link previews."
              - name: photo_alt
                label: Describe the main photo
                type: string
              - name: title
                label: Big name
                type: string
              - name: tagline
                label: Line under the name
                type: string
              - name: note
                label: Small grey line
                type: string
              - name: listen_label
                label: Text of the black button
                type: string
                description: "For example: Listen on Spotify. The button opens the Spotify artist page."
              - name: latest_label
                label: Text of the second button
                type: string
                description: "For example: Newest release. The name of the newest release is added after it."
              - name: stats
                label: Three numbers under the buttons
                type: object
                list: true
                description: "For example 2M+ / Streams across platforms. Three rows look best."
                fields:
                  - name: value
                    label: Number
                    type: string
                  - name: label
                    label: What it counts
                    type: string
          - name: about_title
            label: Heading of the About part
            type: string
          - name: about
            label: About text
            type: text
            description: "An empty line starts a new paragraph. A link looks like this: [word](https://address)."
          - name: callout
            label: Highlighted sentence
            type: string
            description: "Shown in a frame under the About text. Leave empty to hide it."
          - name: facts
            label: Facts table
            type: object
            list: true
            fields:
              - name: label
                label: Name of the fact
                type: string
              - name: value
                label: Value
                type: string
          - name: video
            label: Popular video
            type: object
            fields:
              - name: youtube_id
                label: YouTube video code
                type: string
                description: "The part after v= in the YouTube address."
              - name: title
                label: Describe the video
                type: string
          - name: spotify_artist_id
            label: Spotify artist code
            type: string
            description: "The part after /artist/ in the Spotify address."
          - name: faq_title
            label: Heading of the questions block
            type: string
          - name: faq
            label: Questions and answers (home page)
            type: object
            list: true
            description: "Short facts as questions. Google reads them and can use them in the search results."
            fields:
              - name: q
                label: Question
                type: string
              - name: a
                label: Answer
                type: text

      - name: streams
        label: Streams and views
        type: file
        path: _data/streams.yml
        format: yaml
        fields:
          - name: updated
            label: Date of the numbers
            type: date
            options:
              format: "yyyy-MM-dd"
            description: "Shown as Updated under the numbers. Change it when you change the numbers below."
          - name: show_breakdown
            label: Show the split (platforms, clips, other videos)
            type: boolean
            default: true
          - name: platforms
            label: Streams on music platforms (typed by hand)
            type: object
            list: true
            description: "One row per platform (Spotify, Apple Music, Pandora, Deezer ...) or one row for everything. The site adds them up. Take the numbers from the artist dashboards."
            fields:
              - name: name
                label: Platform
                type: string
              - name: streams
                label: Number of streams (digits only)
                type: number
              - name: as_of
                label: Date of this number
                type: date
                options:
                  format: "yyyy-MM-dd"
          - name: youtube
            label: YouTube
            type: object
            fields:
              - name: handle
                label: Channel name (after the @)
                type: string
              - name: channel_id
                label: Channel ID (optional, starts with UC)
                type: string
              - name: track_videos
                label: Clips of your tracks (video codes)
                type: string
                list: true
                description: "The code after v= in the video address. Views of these videos are shown as music videos. All other videos of the channel are shown as other videos."
              - name: clips_views_fallback
                label: Music video views, typed by hand
                type: number
                description: "Used only until the automatic numbers appear."
              - name: other_views_fallback
                label: Other videos views, typed by hand
                type: number

      - name: links
        label: Links
        type: file
        path: _data/links.yml
        format: yaml
        fields:
          - name: email
            label: Email for contact
            type: string
          - name: follow
            label: Follow SETTWOR (official channels)
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Address
                type: string
              - name: icon
                label: Icon file
                type: string
                description: "For example /images/spotify.svg. Leave empty for no icon."
          - name: elsewhere
            label: Also on the web (right column)
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Address
                type: string
              - name: desc
                label: Short note
                type: string
          - name: reading
            label: Background reading (left column)
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Address
                type: string
              - name: desc
                label: Short note
                type: string

      - name: pages
        label: Page texts
        type: file
        path: _data/pages.yml
        format: yaml
        fields:
          - name: news
            label: News page
            type: object
            fields:
              - name: title
                label: Heading
                type: string
              - name: lead
                label: Line under the heading
                type: string
          - name: photos
            label: Photos page
            type: object
            fields:
              - name: title
                label: Heading
                type: string
              - name: lead
                label: Line under the heading
                type: string
          - name: releases
            label: Releases page
            type: object
            fields:
              - name: title
                label: Heading
                type: string
              - name: lead
                label: Line under the heading
                type: string
              - name: image
                label: Picture at the top
                type: image
                options:
                  path: images
                  rename: true
                  extensions: [jpg, jpeg, png, webp]
              - name: image_alt
                label: Describe the picture
                type: string
              - name: caption
                label: Caption
                type: string

  - name: site
    label: Site
    type: group
    items:

      - name: home
        label: Home page
        type: file
        path: _data/home.yml
        format: yaml
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - name: photo
                label: Main photo
                type: image
                options:
                  path: images
                  rename: true
                  extensions: [jpg, jpeg, png, webp]
                description: "Shown round at the top of the home page and used in Google and in link previews."
              - name: photo_alt
                label: Describe the main photo
                type: string
              - name: title
                label: Big name
                type: string
              - name: tagline
                label: Line under the name
                type: string
              - name: note
                label: Small grey line
                type: string
              - name: listen_label
                label: Text of the black button
                type: string
                description: "For example: Listen on Spotify. The button opens the Spotify artist page."
              - name: latest_label
                label: Text of the second button
                type: string
                description: "For example: Newest release. The name of the newest release is added after it."
          - name: about_title
            label: Heading of the About part
            type: string
          - name: about
            label: About text
            type: text
            description: "An empty line starts a new paragraph. A link looks like this: [word](https://address)."
          - name: callout
            label: Highlighted sentence
            type: string
            description: "Shown in a frame under the About text. Leave empty to hide it."
          - name: facts
            label: Facts table
            type: object
            list: true
            fields:
              - name: label
                label: Name of the fact
                type: string
              - name: value
                label: Value
                type: string
          - name: video
            label: Popular video
            type: object
            fields:
              - name: youtube_id
                label: YouTube video code
                type: string
                description: "The part after v= in the YouTube address."
              - name: title
                label: Describe the video

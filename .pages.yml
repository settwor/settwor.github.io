            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Address
                type: string
              - name: icon
                label: Icon file
                type: string
                description: "For example /images/spotify.svg. Leave empty for no icon."
          - name: elsewhere
            label: Also on the web (right column)
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Address
                type: string
              - name: desc
                label: Short note
                type: string
          - name: reading
            label: Background reading (left column)
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Address
                type: string
              - name: desc
                label: Short note
                type: string

      - name: pages
        label: Page texts
        type: file
        path: _data/pages.yml
        format: yaml
        fields:

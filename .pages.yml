                type: string
              - name: lead
                label: Line under the heading
                type: string
          - name: photos
            label: Photos page
            type: object
            fields:
              - name: title
                label: Heading
                type: string
              - name: lead
                label: Line under the heading
                type: string
          - name: streams
            label: Streams page
            type: object
            fields:
              - name: title
                label: Heading
                type: string
              - name: lead
                label: Line under the heading
                type: string
          - name: releases
            label: Releases page
            type: object
            fields:
              - name: title
                label: Heading
                type: string
              - name: lead
                label: Line under the heading
                type: string
              - name: image

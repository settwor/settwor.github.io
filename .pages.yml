            label: Heading of the questions block
            type: string
          - name: faq
            label: Questions and answers (home page)
            type: object
            list: true
            description: "Short facts as questions. Google reads them and can use them in the search results."
            fields:
              - name: q
                label: Question
                type: string
              - name: a
                label: Answer
                type: text

      - name: links

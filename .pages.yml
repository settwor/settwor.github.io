          - { name: y2026, label: "2026", type: number }
          - { name: y2025, label: "2025", type: number }
          - { name: y2024, label: "2024", type: number }
          - { name: y2023, label: "2023", type: number }
          - { name: y2022, label: "2022", type: number }
          - { name: y2021, label: "2021", type: number }
          - { name: earlier, label: "Earlier (or year unknown)", type: number, description: "Plays you cannot split by year. Shown as Earlier." }

      - name: youtube
        label: "YouTube (automatic)"
        type: file
        path: _data/streams.yml
        format: yaml
        fields:
          - name: youtube
            label: YouTube setup
            type: object
            description: "You do not type YouTube numbers: the site takes them from YouTube about every two weeks. Here you only say which channel and which playlist to count."
            fields:
              - name: handle
                label: Channel name (after the @)
                type: string
              - name: channel_id
                label: Channel ID (optional, starts with UC)
                type: string
              - name: track_playlist
                label: "Releases playlist (code after list=)"
                type: string
                description: "Views of videos in this playlist are shown as Release videos. All other views of the channel are shown as Other videos."
              - name: track_videos
                label: Extra release videos that are not in the playlist (codes after v=)
                type: string
                list: true
              - name: clips_views_fallback
                label: "Backup: release videos views (typed by hand)"
                type: number
                description: "Shown only while the automatic numbers are missing."
              - name: other_views_fallback
                label: "Backup: other videos views (typed by hand)"
                type: number


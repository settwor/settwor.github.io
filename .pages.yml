# =============================================================
# Pages CMS settings for settwor.com.pl
# Open https://app.pagescms.org, sign in with GitHub and choose
# this repository. Everything editable on the site is listed here.
# Sections of the menu: News, News (other languages), the five groups "Texts: <language>", Biography, Photos, Releases, Lyrics, the group
# "Streams" (plays per platform) and the group "Site" (home page, links, page texts).
# =============================================================

# Where uploaded pictures are saved (the folder "images" of the site).
media:
  input: images
  output: /images

content:

  # ---------------------------------------------------------
  # NEWS: one file in the folder _posts per article
  # ---------------------------------------------------------
  - name: news
    label: News
    type: collection
    path: _posts
    format: yaml-frontmatter
    # The name of the file (and so the web address) is made from the title.
    # It is asked only when a new article is created.
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The headline of the article. It is also the first line Google shows."

      - name: description
        label: Short summary
        type: text
        required: true
        description: "One or two sentences (up to 160 characters). Shown under the title, in the news list, in Google and in link previews."

      - name: date
        label: Date and time
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
        description: "When the article was published. Do not change it later."

      - name: image
        label: Cover picture
        type: image
        options:
          path: images/news
          rename: true
          extensions: [jpg, jpeg, png, webp]
        description: "Use a picture at least 1200 pixels wide. It is used on the page, in Google and in link previews."

      - name: image_alt
        label: Describe the picture
        type: string
        description: "For people who cannot see it and for search engines. Say what is shown, for example: SETTWOR in the studio, October 2026."

      - name: image_caption
        label: Picture caption
        type: string
        description: "Optional. A short line under the picture, for example the name of the photographer."

      - name: body
        label: Text of the article
        type: rich-text

      - name: listen_url
        label: Link to the release
        type: string
        description: "Optional. A link to Spotify or another platform. Adds an Open on Spotify button under the article."

      - name: sources
        label: Sources (numbered list at the bottom)
        type: object
        list: true
        description: "Optional. Item 1 is the first row, item 2 the second. In the text, a small mark [1] is a link to #ref-1, [2] a link to #ref-2 ..., so it jumps to this list."
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: Address
            type: string
          - name: site
            label: Site (shown in grey after the title)
            type: string

      - name: updated
        label: Date of the last correction
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
        description: "Leave empty unless you want it. Nothing is added automatically: only when you fill this in, the page shows Updated and Google sees the date."

      - name: published
        label: Show on the website
        type: boolean
        default: true
        description: "Switch off to hide the article without deleting it. Keep it ON for a normal article."

  # ---------------------------------------------------------
  # NEWS IN OTHER LANGUAGES (11.66): one file in the folder _news_tr per
  # translated article. English articles stay in "News" above and are never
  # mixed with these. Needs the collection news_tr in _config.yml (todo i18n.md,
  # Phase 6). Keep ref and permalink as they are: they tie the translation to
  # the English article and to its address (see docs/i18n-guide-ru.md, Phase 8).
  # ---------------------------------------------------------
  - name: news_tr
    label: News (other languages)
    type: collection
    path: _news_tr
    format: yaml-frontmatter
    # File name: <lang>-<yyyy>-<mm>-<dd>-<English slug>.md, for example
    # pl-2026-11-01-SETTWOR-starts-planning-Nutaria-Records.md (Portuguese files have no prefix).
    # The prefix keeps two languages of the same article from overwriting each other.
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, lang, i18n_ready, date]
      primary: title
      sort: [date, lang, title]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Layout
        type: string
        default: article
        hidden: true

      - name: lang
        label: Language
        type: select
        required: true
        options:
          values:
            - { value: pt, label: Português }
            - { value: pl, label: Polski }
            - { value: ru, label: Русский }
            - { value: uk, label: Українська }
            - { value: es, label: Español }
        description: "The language of this translation. It must match the first part of the web address (/pl/news/...)."

      - name: ref
        label: English article (do not change)
        type: string
        required: true
        description: "The name of the English article this text translates (the end of its file name, without the date), for example SETTWOR-launches-Ledgertone. All languages of one article have the same value. Never change it for an existing file."

      - name: i18n_ready
        label: Read and ready for Google
        type: boolean
        default: false
        description: "OFF = the page is hidden from Google and from the language buttons. Switch ON only after you have read the whole text. For a normal new translation keep it OFF."

      - name: title
        label: Title
        type: string
        required: true
        description: "The headline in this language. It is also the first line Google shows."

      - name: description
        label: Short summary
        type: text
        required: true
        description: "One or two sentences (up to 160 characters) in this language. Put the text in quotes if it contains a colon followed by a space."

      - name: date
        label: Date and time
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
        description: "The same date and time as the English article. Do not change it later."

      - name: permalink
        label: Web address (do not change)
        type: string
        required: true
        description: "Form: /<lang>/news/<yyyy>/<mm>/<English slug>/, for example /pl/news/2026/11/SETTWOR-starts-planning-Nutaria-Records/. Google knows this address: never change it for a published page."

      - name: image
        label: Cover picture
        type: image
        options:
          path: images/news
          rename: true
          extensions: [jpg, jpeg, png, webp]
        description: "The same picture as in the English article."

      - name: image_alt
        label: Describe the picture
        type: string
        description: "In this language. Say what is shown."

      - name: image_caption
        label: Picture caption
        type: string
        description: "Optional. In this language."

      - name: body
        label: Text of the article
        type: rich-text

      - name: listen_url
        label: Link to the release
        type: string
        description: "Optional. The same link as in the English article. Do not invent a link."

      - name: sources
        label: Sources (numbered list at the bottom)
        type: object
        list: true
        description: "Optional. The same sources as in the English article, in the same order."
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: Address
            type: string
          - name: site
            label: Site (shown in grey after the title)
            type: string

  # ---------------------------------------------------------
  # BIOGRAPHY: one file in the folder _bio per language.
  # A new language = a new entry. It gets its own web address,
  # its own page in Google and a button in the language list.
  # ---------------------------------------------------------
  - name: bio
    label: Biography
    type: collection
    path: _bio
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [lang_name, lang]
      primary: lang_name
      sort: [order]
    fields:
      - name: lang_name
        label: Language name (shown on the button)
        type: string
        required: true
        description: "In that language, for example: Deutsch, Español, Українська."

      - name: lang
        label: Language code
        type: string
        required: true
        description: "Two letters, lower case: de, es, uk, fr. Google uses it to show the page to people who speak that language."

      - name: order
        label: Place in the language list
        type: number
        description: "1, 2, 3 ... English is 1."

      - name: title
        label: Page title
        type: string
        required: true
        description: "The big heading of the page, for example: SETTWOR Biografie."

      - name: seo_title
        label: Title in Google
        type: string
        description: "Optional. What Google shows as the headline, for example: SETTWOR Offizielle Biografie."

      - name: description
        label: Short summary for Google
        type: text
        required: true
        description: "One or two sentences in that language (up to 160 characters)."

      - name: lead
        label: Line under the heading
        type: string

      - name: photo
        label: Photo
        type: image
        options:
          path: images
          rename: true
          extensions: [jpg, jpeg, png, webp]
        description: "Leave as it is to use the main photo of the site."

      - name: photo_alt
        label: Describe the photo
        type: string

      - name: photo_caption
        label: Photo caption
        type: string

      - name: body
        label: Text of the biography
        type: rich-text
        description: "Use the heading buttons: Heading 2 for big parts (they appear in the contents list), Heading 3 for smaller parts."

      - name: faq_title
        label: Title of the questions block
        type: string
        description: "For example: Questions and answers."

      - name: faq
        label: Questions and answers
        type: object
        list: true
        description: "Short facts as questions. Google can show them in the search results."
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text

      - name: snapshot
        label: Key facts (the box at the top)
        type: object
        list: true
        description: "Short facts shown right under the photo: born, from, genres ... Six rows look best."
        fields:
          - name: label
            label: Name of the fact
            type: string
          - name: value
            label: Value
            type: string

      - name: highlights
        label: Key moments (timeline at the top)
        type: object
        list: true
        description: "The main dates of the career, oldest first. One short sentence each."
        fields:
          - name: year
            label: Year
            type: string
          - name: text
            label: What happened
            type: text

      - name: refs_title
        label: Title of the list of sources
        type: string
        description: "For example: References (Referencias, Przypisy ...). Shown at the bottom, like on Wikipedia."

      - name: sources
        label: Sources (numbered list at the bottom)
        type: object
        list: true
        description: "Item 1 is the first row, item 2 the second and so on. In the text, a small mark [1] is a link to #ref-1, [2] a link to #ref-2 ..., so it jumps to this list."
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: Address
            type: string
          - name: site
            label: Site (shown in grey after the title)
            type: string

      - name: external_title
        label: Title of the list of external links
        type: string
        description: "For example: External links."

      - name: external
        label: External links (list at the bottom)
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: Address
            type: string
          - name: desc
            label: Short note (optional)
            type: string

  # ---------------------------------------------------------
  # PHOTOS: the list in _data/gallery.yml. The year tabs on the
  # Photos page are made from the dates.
  # ---------------------------------------------------------
  - name: photos
    label: Photos
    type: file
    path: _data/gallery.yml
    format: yaml
    fields:
      - name: photos
        label: Photographs
        type: object
        list: true
        description: "Add a photo with the Add button. The page shows the newest day first. Photos of the SAME day appear in the order of this list: the first one in the list is shown first. Drag a photo up or down to change it."
        fields:
          - name: image
            label: Picture
            type: image
            options:
              path: images/photos
              rename: true
              extensions: [jpg, jpeg, png, webp]
            description: "Best size: 2000 pixels on the long side."
          - name: date
            label: Date of the photo
            type: date
            options:
              format: "yyyy-MM-dd"
            description: "The year of this date decides on which year tab the photo appears."
          - name: alt
            label: Describe the photo
            type: string
            description: "For example: SETTWOR in Warsaw, August 2025."

  # ---------------------------------------------------------
  # RELEASES: one file in the folder _releases per release
  # ---------------------------------------------------------
  - name: releases
    label: Releases
    type: collection
    path: _releases
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, artist, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Name of the release
        type: string
        required: true

      - name: artist
        label: Artists
        type: string
        required: true
        description: "For example: SETTWOR or SETTWOR, Mc Baiano."

      - name: date
        label: Release date
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"

      - name: kind
        label: Kind
        type: string
        description: "Single, Album, EP or Mixtape. Empty means Single."

      - name: cover
        label: Cover
        type: image
        options:
          path: images/releases
          rename: true
          extensions: [jpg, jpeg, png, webp]
        description: "A square picture, at least 600 pixels."

      - name: spotify
        label: Spotify link
        type: string
        description: "Optional. The cover then opens this address."

      - name: details
        label: Tracklist page (optional)
        type: string
        description: "Address of a page with the list of tracks, if there is one."

      - name: links
        label: Other platforms
        type: object
        description: "Direct links to this release. Leave a field empty if there is no link: the preview window then offers a search on that platform."
        fields:
          - { name: apple, label: Apple Music, type: string }
          - { name: youtube_music, label: YouTube Music, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: deezer, label: Deezer, type: string }
          - { name: tidal, label: TIDAL, type: string }
          - { name: amazon, label: Amazon Music, type: string }
          - { name: yandex, label: Yandex Music, type: string }
          - { name: vk, label: VK Music, type: string }
          - { name: bandcamp, label: Bandcamp, type: string }

      - name: tracklist
        label: Tracklist
        type: string
        list: true
        description: "One track per line, in order. A single without a list shows its own name."

  # ---------------------------------------------------------
  # LYRICS: one file in the folder "lyrics" per song. The release window
  # (Releases page) shows a "Lyrics" button next to a track when a page with
  # the same name as the track exists. Versions "(sped up)", "(slowed)" ...
  # open the page of the original song.
  # ---------------------------------------------------------
  - name: lyrics
    label: Lyrics
    type: collection
    path: lyrics
    extension: md
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, release]
      primary: title
      sort: [title]
    fields:
      - name: layout
        label: Layout
        type: string
        default: lyrics
        hidden: true

      - name: title
        label: Name of the song
        type: string
        required: true
        description: "Exactly as in the tracklist, for example: GOT ME UP 2. The button appears next to the track with this name."

      - name: artist
        label: Artists
        type: string
        default: SETTWOR

      - name: release
        label: Release (optional)
        type: string
        description: "Shown under the title, for example: GET IT, Vol.1."

      - name: permalink
        label: Web address
        type: string
        description: "Write it like this: /lyrics/name-of-the-song/ (small letters, dashes instead of spaces). Without it the address is made from the file name."

      - name: body
        label: Words of the song
        type: text
        description: "Paste the words. An empty line starts a new verse. Every line break is kept."

  # ---------------------------------------------------------
  # STREAMS: one file per platform, one line per year.
  # A year or a platform left empty is not shown on the Streams page.
  # YouTube numbers are automatic: only its setup is here.
  # ---------------------------------------------------------
  - name: streams
    label: Streams
    type: group
    items:

